name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（编译所有 .py）
        run: python -m compileall -q .

      - name: 冒烟测试（数据文件 + prompt 模板，不依赖 API / 数据 / PG）
        run: |
          python - << 'EOF'
          import json
          import os

          # 1. 药物禁忌知识库格式合法
          with open("drug_contraindications.json", encoding="utf-8") as f:
              drugs = json.load(f)
          assert isinstance(drugs, list) and len(drugs) > 0, "drug_contraindications.json 格式错误"
          print(f"[OK] drug_contraindications.json：{len(drugs)} 条")

          # 2. 7 个 prompt 模板齐全
          for name in ["agent", "consult", "summarize", "qa", "kg", "drug", "his"]:
              p = f"prompts/prompt_template_{name}.txt"
              assert os.path.exists(p), f"缺少模板 {p}"
          print("[OK] prompt 模板：7 个齐全")
          EOF
